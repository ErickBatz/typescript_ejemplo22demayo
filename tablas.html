<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tablas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <h2 class="h4 mb-0">Generador de Tablas de Multiplicar</h2>
                    </div>
                    <div class="card-body">
                        <form id="formTablas">
                            <div class="mb-3">
                                <label for="num-1" class="form-label">Número para la tabla</label>
                                <input type="number" class="form-control" id="num-1" placeholder="Ej: 5" required>
                            </div>
                            <button type="button" id="btnGenerar" class="btn btn-primary w-100">Generar Tabla</button>
                        </form>
                    </div>
                </div>

                <div id="resultadoTablas" class="mt-4 p-3 bg-white border rounded shadow-sm text-aling-center">
                    <!-- Aquí se mostrará la tabla generada -->
                </div>
            </div>
        </div>
    </div>
</body>
<!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dist/tablas.js"></script>

</html>
